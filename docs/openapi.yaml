openapi: 3.0.3
info:
  title: Enterprise Authentication API
  version: 1.0.0
  description: JWT authentication with role-based access control.
paths:
  /api/auditlogs/:
    get:
      operationId: api_auditlogs_list
      description: Read-only API for audit log entries.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - ACTIVATE
          - ASSIGN_PERMISSIONS
          - ASSIGN_ROLES
          - CREATE
          - DEACTIVATE
          - DELETE
          - PASSWORD_CHANGE
          - PASSWORD_RESET
          - UPDATE
        description: |-
          * `CREATE` - Create
          * `UPDATE` - Update
          * `DELETE` - Delete
          * `ASSIGN_ROLES` - Assign roles
          * `ASSIGN_PERMISSIONS` - Assign permissions
          * `ACTIVATE` - Activate
          * `DEACTIVATE` - Deactivate
          * `PASSWORD_CHANGE` - Password change
          * `PASSWORD_RESET` - Password reset
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: content_type
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/auditlogs/{id}/:
    get:
      operationId: api_auditlogs_retrieve
      description: Read-only API for audit log entries.
      parameters:
      - in: path
        name: id
