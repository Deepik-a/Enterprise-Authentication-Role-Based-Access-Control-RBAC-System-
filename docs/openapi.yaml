components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - ASSIGN_ROLES
      - ASSIGN_PERMISSIONS
      - ACTIVATE
      - DEACTIVATE
      - PASSWORD_CHANGE
      - PASSWORD_RESET
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `ASSIGN_ROLES` - Assign roles
        * `ASSIGN_PERMISSIONS` - Assign permissions
        * `ACTIVATE` - Activate
        * `DEACTIVATE` - Deactivate
        * `PASSWORD_CHANGE` - Password change
        * `PASSWORD_RESET` - Password reset
    Activate:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    ActiveState:
      type: object
      properties:
        is_active:
          type: boolean
      required:
      - is_active
    AssignRoles:
      type: object
      properties:
        role_ids:
          type: array
          items:
            type: integer
      required:
      - role_ids
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
        content_type:
          type: integer
        object_type:
          type: string
          readOnly: true
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        object_repr:
          type: string
          maxLength: 200
        changes:
          nullable: true
      required:
      - action
      - actor_email
      - content_type
      - id
      - object_id
      - object_type
      - timestamp
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    DataScopeEnum:
      enum:
      - all
      - team
      - own
      type: string
      description: |-
        * `all` - All records
        * `team` - Own and team records
        * `own` - Own records only
    ForgotPassword:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Login:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Module:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          nullable: true
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        route:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_system:
          type: boolean
          readOnly: true
      required:
      - id
      - is_system
      - name
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        customer_email:
          type: string
          format: email
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_email
      - id
      - product
      - product_name
      - status
      - total
      - unit_price
    OrderStatus:
      type: object
